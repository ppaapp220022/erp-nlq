# main에 PR이 스쿼시 머지되면, 그 PR 위에 쌓여 있던 열린 PR을 main 위로 옮긴다.
# 스쿼시된 커밋과 원래 커밋이 달라 생기는 충돌을 없애는 `git rebase --onto`를 대신 해 준다.
# 푸시는 RESTACK_TOKEN으로 한다. GITHUB_TOKEN으로 푸시하면 checks·ai-review가 다시 돌지 않는다.
name: restack

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: restack
  cancel-in-progress: false

jobs:
  restack:
    # 이 레포 안의 브랜치가 기본 브랜치에 머지됐을 때만. 포크 PR은 건드리지 않는다.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RESTACK_TOKEN }}

      - name: 쌓인 PR 옮기기
        env:
          GH_TOKEN: ${{ secrets.RESTACK_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          MERGED_NUMBER: ${{ github.event.pull_request.number }}
          MERGED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name "erp-nlq restack"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin

          gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,headRefName,baseRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefName) \(.baseRefName)"' |
          while read -r number head base; do
            # 머지된 PR의 원래 커밋을 품고 있는 브랜치만 쌓인 PR이다. 독립 PR은 건너뛴다.
            git merge-base --is-ancestor "$MERGED_SHA" "origin/$head" || continue

            echo "::group::#$number ($head)"
            git switch -C "$head" "origin/$head"
            if git rebase --onto "origin/$BASE" "$MERGED_SHA"; then
              git push --force-with-lease="$head:origin/$head" origin "$head"
              if [[ "$base" != "$BASE" ]]; then
                gh api -X PATCH "repos/$REPO/pulls/$number" -f base="$BASE" > /dev/null
              fi
              gh pr comment "$number" --repo "$REPO" \
                --body "#$MERGED_NUMBER 머지에 맞춰 \`$BASE\` 위로 옮겼다. checks·ai-review가 다시 돈다."
            else
              git rebase --abort
              gh pr comment "$number" --repo "$REPO" \
                --body "#$MERGED_NUMBER 머지 뒤 자동으로 옮기다 충돌이 났다. 직접 옮긴다: \`git rebase --onto origin/$BASE $MERGED_SHA $head\`"
            fi
            echo "::endgroup::"
          done
