[project]
name = "erp-nlq"
version = "0.1.0"
description = "ERP(Odoo) 자연어 질의 계층. 권한은 execute()가 강제한다."
requires-python = ">=3.12"
# 의존성은 쓰는 시점에 추가한다 (M3: sqlglot).
dependencies = [
    "anthropic>=1.0",
    "psycopg[binary]>=3.2",
]

[project.scripts]
nlq = "nlq.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nlq"]
