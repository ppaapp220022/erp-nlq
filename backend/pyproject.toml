[project]
name = "erp-nlq"
version = "0.1.0"
description = "ERP(Odoo) 자연어 질의 계층. 권한은 execute()가 강제한다."
requires-python = ">=3.12"
# 의존성은 쓰는 시점에 추가한다.
dependencies = [
    "anthropic>=1.0",
    "fastapi==0.143.2",  # 10-18~23에 릴리스가 몰려 그 앞 버전으로 고정한다
    "fastembed==0.9.0",  # 예시 임베딩 검색(M5). 0.9.1은 10-24 릴리스라 그 앞 버전
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0.3",
    "sqlglot==30.29.0",  # guard가 sqlglot이 다시 만든 SQL을 실행하므로 버전을 고정한다
    "uvicorn==0.54.0",
]

[project.scripts]
nlq = "nlq.cli:main"
nlq-eval = "nlq.evaluate:main"
nlq-api = "nlq.api:main"
nlq-report = "nlq.report_check:main"
nlq-eval-wren = "nlq.wren_compare:main"

[dependency-groups]
dev = ["httpx", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nlq"]

[tool.uv]
# fastapi·fastembed가 끌어오는 패키지 중 두 주가 안 된 것을 그 앞 버전으로 묶는다
constraint-dependencies = [
    "starlette==1.8.0",
    "filelock==4.2.4",
    "hf-xet==1.7.0",
    "onnxruntime==1.31.0",
]
