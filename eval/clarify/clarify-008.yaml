id: clarify-008
role: sales.park
question: 내 고객별 판매액
expect: 주문 기준인지 송장 기준인지
answer: 송장 기준 매출(부가세 제외, 환불 차감). 회사 구분 없이 고객별 합계
gold_sql: |
  SELECT p.name AS customer, sum(m.amount_untaxed_signed) AS revenue
  FROM account_move m
  JOIN res_partner p ON p.id = m.commercial_partner_id
  WHERE m.state = 'posted' AND m.move_type IN ('out_invoice', 'out_refund') AND m.invoice_user_id = 9
  GROUP BY p.name
order_matters: false
notes: 질문의 "내"는 질문한 사용자(res_users.id 9)
