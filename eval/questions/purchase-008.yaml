id: purchase-008
area: 구매
role: stock.choi
question: 금액이 가장 큰 확정 발주 3건. 발주 번호, 공급사, 부가세 제외 금액
gold_sql: |
  SELECT o.name, p.name AS vendor, o.amount_untaxed
  FROM purchase_order o
  JOIN res_partner p ON p.id = o.partner_id
  WHERE o.state = 'purchase'
  ORDER BY o.amount_untaxed DESC
  LIMIT 3
order_matters: true
notes: 확정 발주만(state = 'purchase')
